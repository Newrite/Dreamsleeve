syntax = "proto3";

package Dreamsleeve.Protocol.Network;

enum DisconnectReason {
  Unspecified = 0;
  ClientShutdown = 1;
  ServerShutdown = 2;
  Kicked = 3;
  AuthFailed = 4;
  TimeoutPolicy = 5;
  ProtocolError = 6;
}
// Fixed wire channel IDs. Reliability is selected per packet by the adapter.
enum DeliveryLane {
  Control = 0;
  Chat = 1;
  Realtime = 2;
  Models = 3;
  Poses = 4;
}
