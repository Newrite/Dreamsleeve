syntax = "proto3";

package Dreamsleeve.Protocol.Chat;

import "common.proto";

message Location {
  FormKey location_id = 1;
  string location_name = 2;
}

message Position { float x = 1; float y = 2; float z = 3; }

// World-space camera forward. Zero means unavailable; not actor Euler angles.
message CameraDirection { float x = 1; float y = 2; float z = 3; }

message PlayerLocation {
  Location location = 1;
  Position position = 2;
  CameraDirection camera_direction = 3;
  // Sender monotonic microseconds; only differences within one character are meaningful.
  // Zero denotes an unstamped source (receive-time interpolation fallback).
  uint64 sampled_at_us = 4;
}

// Whole points: clients round the game's readings, so smaller steps never travel.
message ResourceActorValue { sint32 current = 1; sint32 maximum = 2; }

// What a client reports: its own readings under their keys and labels.
message ActorValueEntry {
  string key = 1;
  string display_name = 2;
  oneof value {
    float scalar = 3; // Explicit zero is a present scalar value.
    ResourceActorValue resource = 4;
  }
}

// A server-assigned number for one (key, display name) pair. The server
// defines every kind to a session before the first message that uses it: in
// SessionOpened or in the PresenceChanged that introduces it. A number lives
// while some online player has that pair and is never reused for another;
// one that no player uses any more is never sent again, so clients may drop it.
message ActorValueKind {
  uint64 id = 1; // Nonzero.
  string key = 2;
  string display_name = 3;
}

// A reading the server publishes, under a kind number instead of strings.
message ActorValue {
  uint64 kind = 1;
  oneof value {
    float scalar = 2; // Explicit zero is a present scalar value.
    ResourceActorValue resource = 3;
  }
}

message PlayerInfo {
  PlayerProfile profile = 1;
  optional string character_name = 2;
  PlayerLocation location = 3;
  repeated ActorValue actor_values = 4; // At most one reading per key.
  uint64 character_generation = 5;
  PlayerDetails details = 6;
  uint64 view_revision = 7;
  uint64 movement_sequence = 8;
  // The player is in a character whose game name failed server moderation;
  // character_name is then absent and clients use their own fallback.
  bool character_name_withheld = 9;
}

enum ActivityKind {
  ACTIVITY_KIND_UNKNOWN = 0;
  ACTIVITY_KIND_EXPLORING = 1;
  ACTIVITY_KIND_COMBAT = 2;
  ACTIVITY_KIND_TALKING = 3;
  ACTIVITY_KIND_BARTERING = 4;
  ACTIVITY_KIND_TRAINING = 5;
  ACTIVITY_KIND_READING = 6;
  ACTIVITY_KIND_LOCKPICKING = 7;
  ACTIVITY_KIND_CRAFTING = 8;
  ACTIVITY_KIND_USING_OBJECT = 9;
  ACTIVITY_KIND_RIDING = 10;
  ACTIVITY_KIND_SNEAKING = 11;
  ACTIVITY_KIND_SWIMMING = 12;
  ACTIVITY_KIND_FLYING = 13;
  ACTIVITY_KIND_DEAD = 14;
  ACTIVITY_KIND_RAGDOLL = 15;
  ACTIVITY_KIND_MENU = 16;
  ACTIVITY_KIND_NEW_GAME = 17;
  ACTIVITY_KIND_LOADING = 18;
}

enum LockDifficulty {
  LOCK_DIFFICULTY_UNKNOWN = 0;
  LOCK_DIFFICULTY_UNLOCKED = 1;
  LOCK_DIFFICULTY_VERY_EASY = 2;
  LOCK_DIFFICULTY_EASY = 3;
  LOCK_DIFFICULTY_AVERAGE = 4;
  LOCK_DIFFICULTY_HARD = 5;
  LOCK_DIFFICULTY_VERY_HARD = 6;
  LOCK_DIFFICULTY_REQUIRES_KEY = 7;
}

message NamedForm { FormKey form = 1; string name = 2; }

message PlayerActivity {
  ActivityKind kind = 1;
  optional string target_name = 2;
  LockDifficulty lock_difficulty = 3;
  optional string menu_key = 4;
}

message PlaceDescription {
  string worldspace_name = 1;
  string location_name = 2;
  string nearby_marker_name = 3;
  string marker_kind = 4;
  bool is_interior = 5;
}

message PlayerDetails {
  NamedForm race = 1;
  optional uint32 level = 2;
  PlayerActivity activity = 3;
  PlaceDescription place = 4;
  optional int64 game_started_at_unix_ms = 5;
}

message BeginCharacter { string name = 1; }

message RenameCharacter { string name = 1; }

// Control channel: establishes a new coordinate context, or clears it.
message SetPlayerLocation {
  uint64 context_revision = 1;
  PlayerLocation location = 2;
}

// Repeated absolute pose; location identity is established reliably.
message MovementPose {
  Position position = 1;
  CameraDirection camera_direction = 2;
  uint64 sampled_at_us = 3;
}
message MovementSample {
  uint64 context_revision = 1;
  uint64 sequence = 2;
  MovementPose pose = 3;
}

message ActorValues { repeated ActorValueEntry values = 1; } // Full replacement, including empty.

message LeaveGame {}

message UpdatePlayer {
  reserved 3, 6;
  reserved "sample_player_state", "sample_movement";
  oneof action {
    BeginCharacter begin_character = 1;
    RenameCharacter rename_character = 2;
    SetPlayerLocation set_location = 8;
    ActorValues set_actor_values = 7;
    LeaveGame leave_game = 4;
    PlayerDetails set_details = 5;
  }
}

// Optional components of PlayerDetails a patch can clear; the activity always has a value.
enum PlayerDetailsField {
  PLAYER_DETAILS_FIELD_UNSPECIFIED = 0;
  PLAYER_DETAILS_FIELD_RACE = 1;
  PLAYER_DETAILS_FIELD_LEVEL = 2;
  PLAYER_DETAILS_FIELD_PLACE = 3;
  PLAYER_DETAILS_FIELD_GAME_STARTED_AT = 4;
}

// What changed in one player's actor values and details since the last tick.
// Absent parts are unchanged; at least one part is present.
message PlayerMetadataPatch {
  uint64 player_id = 1;
  // Kinds the player no longer has, applied before actor_values; a changed
  // label is the old kind removed and the new one set.
  repeated uint64 removed_actor_values = 2;
  repeated ActorValue actor_values = 3; // New or changed readings.
  // The components present here replace the old ones.
  PlayerDetails details = 4;
  repeated PlayerDetailsField cleared_details = 5; // Components that became absent.
}

// Location-only replication avoids resending unchanged actor values.
message PlayerMoved {
  uint64 player_id = 1;
  reserved 2;
  reserved "location";
  uint64 view_revision = 3;
  uint64 sequence = 4;
  MovementPose pose = 5;
}

// Reliable baseline or clear. A realtime sample cannot establish visibility.
// The place is PresenceChanged.space: a visible player shares the recipient's.
message PlayerVisibility {
  uint64 player_id = 1;
  uint64 view_revision = 2;
  uint64 sequence = 3;
  MovementPose pose = 4; // Absent: the player is no longer visible.
}

// Everything that changed in the online list for one recipient: one message
// per replication tick, plus one per joining or leaving player. Parts apply in
// field order: kinds, joined, updated, metadata, visibility, left.
message PresenceChanged {
  repeated ActorValueKind actor_value_kinds = 1; // Kinds new to the recipient.
  repeated PlayerInfo joined = 2;
  // Identity or character changes: the whole player again, with no position.
  repeated PlayerInfo updated = 3;
  repeated PlayerMetadataPatch metadata = 4;
  // The recipient's own place; present exactly when a visibility entry has a pose.
  Location space = 5;
  repeated PlayerVisibility visibility = 6;
  repeated uint64 left = 7;
}

// Independent absolute poses for one recipient. Omission never clears visibility.
message PlayersMoved {
  repeated PlayerMoved players = 1;
}
