syntax = "proto3";

package Dreamsleeve.Protocol.Chat;

import "common.proto";

message Location {
  FormKey location_id = 1;
  string location_name = 2;
}

message Position { float x = 1; float y = 2; float z = 3; }

// Euler angles in radians, in the same axes as Position.
message Rotation { float x = 1; float y = 2; float z = 3; }

message PlayerLocation {
  Location location = 1;
  Position position = 2;
  Rotation rotation = 3;
  // Sender monotonic microseconds; only differences within one character are meaningful.
  // Zero denotes an unstamped source (receive-time interpolation fallback).
  uint64 sampled_at_us = 4;
}

message ResourceActorValue { float current = 1; float maximum = 2; }

message ActorValueEntry {
  string key = 1;
  string display_name = 2;
  oneof value {
    float scalar = 3; // Explicit zero is a present scalar value.
    ResourceActorValue resource = 4;
  }
}

message PlayerInfo {
  PlayerProfile profile = 1;
  optional string character_name = 2;
  PlayerLocation location = 3;
  repeated ActorValueEntry actor_values = 4;
  uint64 character_generation = 5;
  PlayerDetails details = 6;
  uint64 view_revision = 7;
  uint64 movement_sequence = 8;
}

enum ActivityKind {
  ACTIVITY_KIND_UNKNOWN = 0;
  ACTIVITY_KIND_EXPLORING = 1;
  ACTIVITY_KIND_COMBAT = 2;
  ACTIVITY_KIND_TALKING = 3;
  ACTIVITY_KIND_BARTERING = 4;
  ACTIVITY_KIND_TRAINING = 5;
  ACTIVITY_KIND_READING = 6;
  ACTIVITY_KIND_LOCKPICKING = 7;
  ACTIVITY_KIND_CRAFTING = 8;
  ACTIVITY_KIND_USING_OBJECT = 9;
  ACTIVITY_KIND_RIDING = 10;
  ACTIVITY_KIND_SNEAKING = 11;
  ACTIVITY_KIND_SWIMMING = 12;
  ACTIVITY_KIND_FLYING = 13;
  ACTIVITY_KIND_DEAD = 14;
  ACTIVITY_KIND_RAGDOLL = 15;
  ACTIVITY_KIND_MENU = 16;
  ACTIVITY_KIND_NEW_GAME = 17;
  ACTIVITY_KIND_LOADING = 18;
}

enum LockDifficulty {
  LOCK_DIFFICULTY_UNKNOWN = 0;
  LOCK_DIFFICULTY_UNLOCKED = 1;
  LOCK_DIFFICULTY_VERY_EASY = 2;
  LOCK_DIFFICULTY_EASY = 3;
  LOCK_DIFFICULTY_AVERAGE = 4;
  LOCK_DIFFICULTY_HARD = 5;
  LOCK_DIFFICULTY_VERY_HARD = 6;
  LOCK_DIFFICULTY_REQUIRES_KEY = 7;
}

message NamedForm { FormKey form = 1; string name = 2; }

message PlayerActivity {
  ActivityKind kind = 1;
  optional string target_name = 2;
  LockDifficulty lock_difficulty = 3;
  optional string menu_key = 4;
}

message PlaceDescription {
  string worldspace_name = 1;
  string location_name = 2;
  string nearby_marker_name = 3;
  string marker_kind = 4;
  bool is_interior = 5;
}

message PlayerDetails {
  NamedForm race = 1;
  optional uint32 level = 2;
  PlayerActivity activity = 3;
  PlaceDescription place = 4;
  optional int64 game_started_at_unix_ms = 5;
}

message BeginCharacter { string name = 1; }

message RenameCharacter { string name = 1; }

// Control channel: establishes a new coordinate context, or clears it.
message SetPlayerLocation {
  uint64 context_revision = 1;
  PlayerLocation location = 2;
}

// Repeated absolute pose; location identity is established reliably.
message MovementPose {
  Position position = 1;
  Rotation rotation = 2;
  uint64 sampled_at_us = 3;
}
message MovementSample {
  uint64 context_revision = 1;
  uint64 sequence = 2;
  MovementPose pose = 3;
}

message ActorValues { repeated ActorValueEntry values = 1; } // Full replacement, including empty.

message LeaveGame {}

message UpdatePlayer {
  reserved 3, 6;
  reserved "sample_player_state", "sample_movement";
  oneof action {
    BeginCharacter begin_character = 1;
    RenameCharacter rename_character = 2;
    SetPlayerLocation set_location = 8;
    ActorValues set_actor_values = 7;
    LeaveGame leave_game = 4;
    PlayerDetails set_details = 5;
  }
}

message PlayerJoined { PlayerInfo player = 1; }

message PlayerUpdated { PlayerInfo player = 1; }

// At least one component is present. Absent means unchanged; present replaces that component.
message PlayerMetadataChanged {
  uint64 player_id = 1;
  ActorValues actor_values = 2;
  PlayerDetails details = 3;
}

// Location-only replication avoids resending unchanged actor values.
message PlayerMoved {
  uint64 player_id = 1;
  reserved 2;
  reserved "location";
  uint64 view_revision = 3;
  uint64 sequence = 4;
  MovementPose pose = 5;
}

// Reliable baseline/clear. A realtime sample cannot establish visibility.
message PlayerVisibilityChanged {
  uint64 player_id = 1;
  uint64 view_revision = 2;
  uint64 sequence = 3;
  PlayerLocation location = 4;
}

message PlayerLeft { uint64 player_id = 1; }

// Independent absolute poses for one recipient. Omission never clears visibility.
message PlayersMoved {
  repeated PlayerMoved players = 1;
}
