syntax = "proto3";

package Dreamsleeve.Protocol.Chat;

import "chat.proto";
import "player.proto";

// Where other players see the server pseudonym instead of the sender's names.
// Presence (online list, name above the firefly) and chat (messages, client
// announcements) always go together; ground marks may keep the real profile.
enum HiddenIdentity {
  HIDDEN_IDENTITY_NONE = 0; // The names are shown everywhere.
  HIDDEN_IDENTITY_EVERYWHERE = 1; // Presence, chat and ground marks.
  HIDDEN_IDENTITY_EXCEPT_GROUND_MARKS = 2; // Presence and chat; marks show the real profile.
}

// Opaque single-use credential: 32 random bytes encoded as unpadded base64url.
// Identity comes from the authenticated ticket; do not send player-supplied names.
message OpenSession {
  reserved 1, 2;
  reserved "username", "display_name";
  string session_ticket = 3;
  // Other players see a server pseudonym there from the very first packet.
  HiddenIdentity hidden_identity = 4;
}

// A client that has not signed in keeps its connection as a guest: the server
// counts it online, and a session opens later on the same connection. No
// reply; on a connection that is not waiting it is refused as INVALID_REQUEST.
message JoinAsGuest {}

message SessionOpened {
  string server_name = 6;
  uint64 self_player_id = 1;
  // Version 6 had a single global channel and its tail here.
  reserved 2, 3, 4;
  reserved "global_channel_id", "recent_messages";
  repeated PlayerInfo players = 5; // Complete online list, including self.
  AnnouncementPolicy announcements = 7;
  // Every channel of the session: one GLOBAL and one SYSTEM in version 7.
  repeated ChatChannel channels = 8;
  // The receiver's own pseudonym while their names are hidden anywhere; the
  // self entry in players always keeps the real profile.
  optional string own_pseudonym = 9;
  // Where the receiver's names are hidden in this session.
  HiddenIdentity hidden_identity = 10;
  // The receiver's mute in force when the session opened; absent: not muted.
  MuteState mute = 11;
}

// A mute in force on the receiver: chat, notes, client announcements and the
// display name are refused (MUTED) until it ends. Reading is not limited.
message MuteState {
  string reason = 1; // The moderator's words, one line.
  optional int64 until_unix_ms = 2; // Absent: until lifted.
}

// The receiver's own mute changed. Control lane, no request_id.
message MuteChanged {
  MuteState mute = 1; // Absent: lifted.
}

enum SessionEndReason {
  SESSION_END_REASON_UNSPECIFIED = 0;
  SESSION_END_REASON_ACCESS_REVOKED = 1; // An administrator revoked the saved logins.
  SESSION_END_REASON_BANNED = 2;
  SESSION_END_REASON_KICKED = 3;
}

// Why the server ends the session; the connection closes right after. Control
// lane, no request_id. A banned player may still connect as a guest.
message SessionEnded {
  SessionEndReason reason = 1;
  string text = 2; // The moderator's reason; empty when access was revoked.
  optional int64 until_unix_ms = 3; // A ban with an end.
}

// Choose where the sender's names are hidden from other players. Control lane;
// settled by IdentityVisibilityChanged or RequestRejected (RATE_LIMITED,
// HIDDEN_IDENTITY_NOT_ALLOWED).
message SetIdentityVisibility {
  HiddenIdentity hidden = 1;
}

// Settles SetIdentityVisibility: where the names are hidden now and the
// pseudonym others see there, absent when they are shown everywhere.
message IdentityVisibilityChanged {
  optional string pseudonym = 1;
  HiddenIdentity hidden = 2;
}

// Change the sender's own display name. Control lane; settled by
// DisplayNameChanged or RequestRejected (INVALID_REQUEST, TEXT_NOT_ALLOWED,
// RATE_LIMITED, DISPLAY_NAME_CHANGE_NOT_ALLOWED, OVERLOADED). The username and
// the PlayerId never change.
message ChangeDisplayName {
  string display_name = 1;
}

// Settles ChangeDisplayName with the name as stored (trimmed, NFC). The other
// players receive the new profile as PlayerUpdated, unless the sender hides
// their names: then they keep seeing the pseudonym.
message DisplayNameChanged {
  string display_name = 1;
}
