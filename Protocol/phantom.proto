syntax = "proto3";
package Dreamsleeve.Protocol.Phantom;

// Bulk control and chunks share the reliable Models lane. Pose samples use Poses.
message Preferences { bool publish = 1; bool receive = 2; uint32 maximum = 3; float distance = 4; }
message AssetDescriptor {
  bytes hash = 1; uint64 generation = 2; uint32 format_version = 3;
  uint32 compressed_bytes = 4; uint32 raw_bytes = 5;
  uint32 channels = 6; uint32 geometry = 7;
}
message Publish { AssetDescriptor asset = 1; uint64 context_revision = 2; uint64 request_id = 3; }
message Chunk { uint64 transfer_id = 1; uint32 offset = 2; bytes data = 3; }
message Download { uint64 player_id = 1; uint64 generation = 2; uint64 request_id = 3; }
message Cancel { uint64 transfer_id = 1; }
message Progress { uint64 transfer_id = 1; uint32 next_offset = 2; }
message Withdraw {}
message ClientAssetPacket {
  uint32 protocol_version = 1;
  oneof payload {
    Preferences preferences = 2; Publish publish = 3; Chunk chunk = 4;
    Download download = 5; Cancel cancel = 6; Withdraw withdraw = 7; Progress progress = 8;
  }
}
message Offer { uint64 player_id = 1; uint64 view_revision = 2; AssetDescriptor asset = 3; }
message Transfer { uint64 transfer_id = 1; AssetDescriptor asset = 2; uint64 player_id = 3; bool upload = 4; uint64 request_id = 5; }
message Complete {
  uint64 transfer_id = 1;
  bool accepted = 2;
  string reason = 3;
  // Required when admission fails before a transfer ID has been assigned.
  uint64 player_id = 4;
  uint64 generation = 5;
  uint32 retry_after_ms = 6;
  bool upload = 7;
  uint64 request_id = 8;
}
message Remove { uint64 player_id = 1; uint64 view_revision = 2; }
message Policy {
  bool enabled = 1; uint32 raw_asset_bytes = 2; uint32 compressed_asset_bytes = 3;
  uint32 channels = 4; uint32 geometry = 5; uint32 pose_bytes = 6; uint32 compressed_pose_bytes = 7;
  uint32 sample_rate = 8; uint32 maximum_visible = 9; float distance = 10;
  uint32 window_chunks = 11; uint32 concurrent_transfers = 12;
  uint32 model_bytes_per_second = 13; uint32 pose_bytes_per_second = 14;
}
message ServerAssetPacket {
  uint32 protocol_version = 1;
  oneof payload { Offer offer = 2; Transfer transfer = 3; Chunk chunk = 4; Complete complete = 5; Remove remove = 6; Progress progress = 7; Policy policy = 8; }
}
// The payload is the bounded independently compressed Dreamsleeve pose format.
message PoseSample {
  uint64 generation = 1; uint64 context_revision = 2; uint64 sequence = 3;
  uint64 sampled_at_us = 4; bytes payload = 5;
}
message ClientPosePacket { uint32 protocol_version = 1; PoseSample sample = 2; }
message ServerPosePacket {
  uint32 protocol_version = 1; uint64 player_id = 2; uint64 view_revision = 3; PoseSample sample = 4;
}
