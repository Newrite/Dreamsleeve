syntax = "proto3";
package Dreamsleeve.Protocol.Phantom;

// Reliable Models carries lifecycle/capabilities only; opaque bodies use HTTP. Poses use Poses.
message Preferences { bool publish = 1; bool receive = 2; uint32 maximum = 3; float distance = 4; }
message AssetDescriptor {
  bytes hash = 1; uint64 generation = 2; uint32 format_version = 3;
  uint32 compressed_bytes = 4; uint32 raw_bytes = 5;
  uint32 channels = 6;
  reserved 7; reserved "geometry";
}
message AssetDelta { bytes base_hash = 1; bytes hash = 2; uint32 compressed_bytes = 3; }
message Publish { AssetDelta delta = 4; AssetDescriptor asset = 1; uint64 context_revision = 2; uint64 request_id = 3; }
message Download { bytes base_hash = 4; uint64 player_id = 1; uint64 generation = 2; uint64 request_id = 3; }
message Cancel { uint64 transfer_id = 1; }
// Sent only after a native scene has applied its first pose and become visible.
message Displayed { uint64 player_id = 1; uint64 view_revision = 2; uint64 generation = 3; }
// The publisher may retire its prior bindings and prepare another generation.
message PoseDemand { uint64 context_revision = 1; bool required = 2; }

message Settled { uint64 generation = 1; uint64 context_revision = 2; }
message Withdraw {}
message ClientAssetPacket {
  reserved 4, 8; reserved "chunk", "progress";
  uint32 protocol_version = 1;
  oneof payload {
    Preferences preferences = 2; Publish publish = 3;
    Download download = 5; Cancel cancel = 6; Withdraw withdraw = 7; Displayed displayed = 9;
  }
}
message Offer { uint64 player_id = 1; uint64 view_revision = 2; AssetDescriptor asset = 3; }
message Transfer { AssetDelta delta = 7; uint64 transfer_id = 1; AssetDescriptor asset = 2; uint64 player_id = 3; bool upload = 4; uint64 request_id = 5; string http_token = 6; }
// How a transfer, or the request for one, ended.
enum TransferOutcome {
  TRANSFER_OUTCOME_UNSPECIFIED = 0;
  TRANSFER_OUTCOME_ACCEPTED = 1;
  // An admitted transfer ended early.
  TRANSFER_OUTCOME_SOURCE_CHANGED = 2;
  TRANSFER_OUTCOME_CONTEXT_CHANGED = 3;
  TRANSFER_OUTCOME_VIEW_REMOVED = 4;
  TRANSFER_OUTCOME_DISCONNECTED = 5;
  TRANSFER_OUTCOME_CANCELLED = 6;
  TRANSFER_OUTCOME_STALE = 7;
  TRANSFER_OUTCOME_SUPERSEDED = 8;
  TRANSFER_OUTCOME_TIMEOUT = 9;
  TRANSFER_OUTCOME_STORAGE_FAILURE = 10; // detail names the failure.
  TRANSFER_OUTCOME_HTTP_FAILURE = 11; // detail names the failure.
  // The request was refused before a transfer began.
  TRANSFER_OUTCOME_DELTA_BASE_UNAVAILABLE = 12; // Publish the full model instead.
  TRANSFER_OUTCOME_PUBLISH_REFUSED = 13;
  TRANSFER_OUTCOME_REPLACEMENT_PENDING = 14;
  TRANSFER_OUTCOME_INITIAL_DISPLAY_PENDING = 15;
  TRANSFER_OUTCOME_PUBLISH_COOLDOWN = 16;
  TRANSFER_OUTCOME_SOURCE_LIMIT = 17;
  TRANSFER_OUTCOME_TRANSFER_LIMIT = 18;
  TRANSFER_OUTCOME_VIEW_UNAVAILABLE = 19;
}
message Complete {
  reserved 2; reserved "accepted";
  uint64 transfer_id = 1;
  TransferOutcome outcome = 9;
  // Diagnostic text for logs only; never decides behavior.
  string detail = 3;
  // Required when admission fails before a transfer ID has been assigned.
  uint64 player_id = 4;
  uint64 generation = 5;
  uint32 retry_after_ms = 6;
  bool upload = 7;
  uint64 request_id = 8;
}
message Remove { uint64 player_id = 1; uint64 view_revision = 2; }
message Policy {
  bool enabled = 1; uint32 raw_asset_bytes = 2; uint32 compressed_asset_bytes = 3;
  reserved 5; reserved "geometry";
  uint32 channels = 4; uint32 pose_bytes = 6; uint32 compressed_pose_bytes = 7;
  uint32 sample_rate = 8; uint32 maximum_visible = 9; float distance = 10;
  reserved 11; reserved "window_chunks";
  uint32 concurrent_transfers = 12;
  uint32 model_bytes_per_second = 13; uint32 pose_bytes_per_second = 14;
}
message ServerAssetPacket {
  reserved 4, 7; reserved "chunk", "progress";
  uint32 protocol_version = 1;
  oneof payload { Offer offer = 2; Transfer transfer = 3; Complete complete = 5; Remove remove = 6; Policy policy = 8; Settled settled = 9;
    PoseDemand pose_demand = 10; }
}
// The payload is the bounded independently compressed Dreamsleeve pose format.
message PoseSample {
  uint64 generation = 1; uint64 context_revision = 2; uint64 sequence = 3;
  uint64 sampled_at_us = 4; bytes payload = 5;
}
// During replacement, both samples describe the SAME source time/context.
// Each payload is complete and independently decodable against its own NIF.
message ClientPosePacket { uint32 protocol_version = 1; PoseSample sample = 2; PoseSample previous_sample = 3; }
message ServerPosePacket {
  uint32 protocol_version = 1; uint64 player_id = 2; uint64 view_revision = 3; PoseSample sample = 4; PoseSample previous_sample = 5;
}
