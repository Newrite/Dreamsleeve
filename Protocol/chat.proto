syntax = "proto3";

package Dreamsleeve.Protocol.Chat;

// One serialized envelope per reliable ENet packet. Version 4 replicates full player state and opens sessions
// with a single-use ticket issued by the separate authenticated HTTP endpoint. A session belongs to one ENet connection; opening it again
// requires reconnecting. Transport Connected alone is not application readiness.
message ClientPacket {
  uint32 protocol_version = 1;
  uint64 request_id = 2; // Nonzero, assigned by the initiating client.
  oneof payload {
    OpenSession open_session = 10;
    SendChat send_chat = 11;
    UpdatePlayer update_player = 12;
  }
}

// Correlation is recipient-specific. A chat broadcast includes request_id only
// in the copy sent to its initiating connection. Others receive the same message
// without request_id and apply it through the same state-update path.
message ServerPacket {
  uint32 protocol_version = 1;
  optional uint64 request_id = 2;
  oneof payload {
    SessionOpened session_opened = 10;
    ChatPublished chat_published = 11;
    RequestRejected request_rejected = 12;
    PlayerJoined player_joined = 13;
    PlayerLeft player_left = 14;
    PlayerUpdated player_updated = 15;
    PlayerUpdateAccepted player_update_accepted = 16;
    PlayerMoved player_moved = 17;
    PlayerMetadataChanged player_metadata_changed = 18;
  }
}

// Opaque single-use credential: 32 random bytes encoded as unpadded base64url.
// Identity comes from the authenticated ticket; do not send player-supplied names.
message OpenSession {
  reserved 1, 2;
  reserved "username", "display_name";
  string session_ticket = 3;
}

message SendChat {
  uint64 channel_id = 1;
  string text = 2;
}

message PlayerProfile {
  uint64 player_id = 1;
  string username = 2;
  string display_name = 3;
}

message FormKey {
  string plugin_name = 1;
  uint32 local_form_id = 2;
}

message Location {
  FormKey location_id = 1;
  string location_name = 2;
}

message Position { float x = 1; float y = 2; float z = 3; }
// Euler angles in radians, in the same axes as Position.
message Rotation { float x = 1; float y = 2; float z = 3; }

message PlayerLocation {
  Location location = 1;
  Position position = 2;
  Rotation rotation = 3;
}

message ResourceActorValue { float current = 1; float maximum = 2; }
message ActorValueEntry {
  string key = 1;
  string display_name = 2;
  oneof value {
    float scalar = 3; // Explicit zero is a present scalar value.
    ResourceActorValue resource = 4;
  }
}

message PlayerInfo {
  PlayerProfile profile = 1;
  optional string character_name = 2;
  PlayerLocation location = 3;
  repeated ActorValueEntry actor_values = 4;
  uint64 character_generation = 5;
  PlayerDetails details = 6;
}

enum ActivityKind {
  ACTIVITY_KIND_UNKNOWN = 0;
  ACTIVITY_KIND_EXPLORING = 1;
  ACTIVITY_KIND_COMBAT = 2;
  ACTIVITY_KIND_TALKING = 3;
  ACTIVITY_KIND_BARTERING = 4;
  ACTIVITY_KIND_TRAINING = 5;
  ACTIVITY_KIND_READING = 6;
  ACTIVITY_KIND_LOCKPICKING = 7;
  ACTIVITY_KIND_CRAFTING = 8;
  ACTIVITY_KIND_USING_OBJECT = 9;
  ACTIVITY_KIND_RIDING = 10;
  ACTIVITY_KIND_SNEAKING = 11;
  ACTIVITY_KIND_SWIMMING = 12;
  ACTIVITY_KIND_FLYING = 13;
  ACTIVITY_KIND_DEAD = 14;
  ACTIVITY_KIND_RAGDOLL = 15;
  ACTIVITY_KIND_MENU = 16;
  ACTIVITY_KIND_NEW_GAME = 17;
  ACTIVITY_KIND_LOADING = 18;
}

enum LockDifficulty {
  LOCK_DIFFICULTY_UNKNOWN = 0;
  LOCK_DIFFICULTY_UNLOCKED = 1;
  LOCK_DIFFICULTY_VERY_EASY = 2;
  LOCK_DIFFICULTY_EASY = 3;
  LOCK_DIFFICULTY_AVERAGE = 4;
  LOCK_DIFFICULTY_HARD = 5;
  LOCK_DIFFICULTY_VERY_HARD = 6;
  LOCK_DIFFICULTY_REQUIRES_KEY = 7;
}

message NamedForm { FormKey form = 1; string name = 2; }
message PlayerActivity {
  ActivityKind kind = 1;
  optional string target_name = 2;
  LockDifficulty lock_difficulty = 3;
  optional string menu_key = 4;
}
message PlaceDescription {
  string worldspace_name = 1;
  string location_name = 2;
  string nearby_marker_name = 3;
  string marker_kind = 4;
  bool is_interior = 5;
}
message PlayerDetails {
  NamedForm race = 1;
  optional uint32 level = 2;
  PlayerActivity activity = 3;
  PlaceDescription place = 4;
  optional int64 game_started_at_unix_ms = 5;
}

message BeginCharacter { string name = 1; }
message RenameCharacter { string name = 1; }
message SampleMovement {
  PlayerLocation location = 1; // Absence clears current position; WRLD/CELL travels with coordinates.
}
message ActorValues { repeated ActorValueEntry values = 1; } // Full replacement, including empty.
message LeaveGame {}
message UpdatePlayer {
  reserved 3;
  reserved "sample_player_state";
  oneof action {
    BeginCharacter begin_character = 1;
    RenameCharacter rename_character = 2;
    SampleMovement sample_movement = 6;
    ActorValues set_actor_values = 7;
    LeaveGame leave_game = 4;
    PlayerDetails set_details = 5;
  }
}

message ChatMessage {
  uint64 message_id = 1;
  uint64 channel_id = 2;
  PlayerProfile author = 3; // Profile at the time of sending, possibly offline now.
  string text = 4;
  int64 sent_at_unix_ms = 5;
}

message SessionOpened {
  uint64 self_player_id = 1;
  uint64 global_channel_id = 2;
  reserved 3; // Version 2 contained PlayerProfile entries here.
  repeated PlayerInfo players = 5; // Complete online list, including self.
  repeated ChatMessage recent_messages = 4; // Retained tail, ascending message_id.
}

message ChatPublished { ChatMessage message = 1; }
message PlayerJoined { PlayerInfo player = 1; }
message PlayerUpdated { PlayerInfo player = 1; }
// At least one component is present. Absent means unchanged; present replaces that component.
message PlayerMetadataChanged {
  uint64 player_id = 1;
  ActorValues actor_values = 2;
  PlayerDetails details = 3;
}
// Location-only replication avoids resending unchanged actor values.
message PlayerMoved { uint64 player_id = 1; PlayerLocation location = 2; }
// Settles the command; authoritative state arrives through periodic replication.
message PlayerUpdateAccepted {}
message PlayerLeft { uint64 player_id = 1; }

// Stable application rejection codes shared by client and server.
// Never reuse numeric values; reserve removed values/names when evolving this enum.
enum RequestRejectionCode {
  REQUEST_REJECTION_CODE_UNSPECIFIED = 0; // Invalid in a RequestRejected response.
  REQUEST_REJECTION_CODE_INVALID_REQUEST = 1; // Invalid field or command arguments.
  REQUEST_REJECTION_CODE_SESSION_NOT_READY = 2; // No ready application session.
  REQUEST_REJECTION_CODE_SESSION_ALREADY_OPEN = 3; // Repeated OpenSession.
  REQUEST_REJECTION_CODE_USERNAME_TAKEN = 4; // Requested username is already reserved.
  REQUEST_REJECTION_CODE_CHANNEL_NOT_FOUND = 5; // Requested channel does not exist.
  REQUEST_REJECTION_CODE_NOT_CHANNEL_MEMBER = 6; // Sender may not publish to this channel.
  REQUEST_REJECTION_CODE_OVERLOADED = 7; // Request was not admitted; the session remains usable.
  REQUEST_REJECTION_CODE_AUTHENTICATION_FAILED = 8; // Missing, expired, invalid or already consumed ticket.
}

// Code controls program behavior; message is a display/diagnostic fallback.
// Clients preserve unknown nonzero codes from newer servers with their message.
// request_id in the envelope is mandatory for this first command-response slice.
message RequestRejected {
  RequestRejectionCode code = 1;
  string message = 2;
  string field = 3;
}
