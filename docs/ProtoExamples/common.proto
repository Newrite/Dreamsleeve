// Historical design example; not the current Dreamsleeve contract.
// See docs/CurrentStateRu.md and the README in this example directory.
syntax = "proto3";

package mmochat.v1;

option csharp_namespace = "MmoChat.Protocol.V1";

// Общие перечисления, ссылки на сущности и компактные summary-модели.
// Эти типы импортируются остальными .proto-файлами.

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_GLOBAL = 1;
  CHANNEL_TYPE_PARTY = 2;
  CHANNEL_TYPE_GUILD = 3;
  CHANNEL_TYPE_DIRECT = 4;
  CHANNEL_TYPE_SYSTEM = 5;
}

// Важно: All chat не является серверным каналом.
// Это клиентский агрегированный view поверх Global/Party/Guild/Direct/System.
message ChatAddress {
  ChannelType channel_type = 1;
  // scope_id:
  // - GLOBAL -> 0
  // - PARTY  -> party_id
  // - GUILD  -> guild_id
  // - DIRECT -> dialog_id
  // - SYSTEM -> 0
  uint64 scope_id = 2;
}

enum PartyRole {
  PARTY_ROLE_UNSPECIFIED = 0;
  PARTY_ROLE_MEMBER = 1;
  PARTY_ROLE_LEADER = 2;
}

enum GuildRole {
  GUILD_ROLE_UNSPECIFIED = 0;
  GUILD_ROLE_MEMBER = 1;
  GUILD_ROLE_OFFICER = 2;
  GUILD_ROLE_MASTER = 3;
}

enum StaffRole {
  STAFF_ROLE_UNSPECIFIED = 0;
  STAFF_ROLE_NONE = 1;
  STAFF_ROLE_MODERATOR = 2;
  STAFF_ROLE_GAME_MASTER = 3;
  STAFF_ROLE_OWNER = 4;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ACCEPT = 1;
  DECISION_DECLINE = 2;
  DECISION_IGNORE = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNKNOWN = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_INVALID_ARGUMENT = 5;
  ERROR_CODE_RATE_LIMITED = 6;
  ERROR_CODE_CONFLICT = 7;
  ERROR_CODE_ALREADY_EXISTS = 8;
  ERROR_CODE_EXPIRED = 9;
  ERROR_CODE_NOT_IN_PARTY = 10;
  ERROR_CODE_NOT_IN_GUILD = 11;
  ERROR_CODE_NOT_PARTY_LEADER = 12;
  ERROR_CODE_NOT_GUILD_OFFICER = 13;
  ERROR_CODE_NOT_GUILD_MASTER = 14;
  ERROR_CODE_GUILD_MUTED = 15;
  ERROR_CODE_GLOBALLY_MUTED = 16;
  ERROR_CODE_GLOBALLY_BANNED = 17;
  ERROR_CODE_BLOCKED_BY_TARGET = 18;
  ERROR_CODE_TARGET_BLOCKED = 19;
  ERROR_CODE_LIMIT_REACHED = 20;
  ERROR_CODE_STREAMER_FILTER_REJECTED = 21;
}

message ErrorInfo {
  ErrorCode code = 1;
  string message = 2;
  repeated string details = 3;
}

message OperationSuccess {
  string message = 1;
}

message IdentityRef {
  uint64 player_id = 1;
  string nickname = 2;
}

message Pagination {
  uint32 offset = 1;
  uint32 limit = 2;
}

message ChatCursor {
  ChatAddress address = 1;
  uint64 last_seen_message_seq = 2;
}

message PartySummary {
  uint64 party_id = 1;
  uint64 leader_player_id = 2;
  uint32 member_count = 3;
  bool disbanded = 4;
}

message GuildSummary {
  uint64 guild_id = 1;
  string guild_name = 2;
  GuildRole my_role = 3;
  uint32 member_count = 4;
  bool disbanded = 5;
}

message DirectDialogSummary {
  uint64 dialog_id = 1;
  IdentityRef other_party = 2;
  int64 last_message_at_unix_ms = 3;
}

message PartyMember {
  IdentityRef identity = 1;
  PartyRole role = 2;
  bool online = 3;
  int64 joined_at_unix_ms = 4;
}

message GuildMember {
  IdentityRef identity = 1;
  GuildRole role = 2;
  bool online = 3;
  int64 joined_at_unix_ms = 4;
  int64 muted_until_unix_ms = 5;
}

message FriendEntry {
  IdentityRef identity = 1;
  bool online = 2;
  int64 added_at_unix_ms = 3;
}

message BlockEntry {
  IdentityRef identity = 1;
  int64 added_at_unix_ms = 2;
}

message PlayerDirectoryEntry {
  IdentityRef identity = 1;
  bool online = 2;
  string current_location = 3;
  uint32 hp = 4;
  uint32 hp_max = 5;
  repeated uint64 guild_ids = 6;
  optional uint64 party_id = 7;
}

message ServerSettingsSnapshot {
  bool streamer_filter_enabled = 1;
  uint32 max_guild_members = 2;
  uint32 max_party_members = 3;
  uint32 max_guilds_per_player = 4;
  uint32 max_guilds_created_per_player = 5;
  uint32 global_chat_message_max_length = 6;
  uint32 private_message_max_length = 7;
  uint32 guild_name_max_length = 8;
  uint32 nickname_max_length = 9;
  uint32 reconnect_history_retention_seconds = 10;
  uint32 offline_party_leader_handoff_seconds = 11;
}
