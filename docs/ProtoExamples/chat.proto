// Historical design example; not the current Dreamsleeve contract.
// See docs/CurrentStateRu.md and the README in this example directory.
syntax = "proto3";

package mmochat.v1;

option csharp_namespace = "MmoChat.Protocol.V1";

import "common.proto";

// Сообщения чатов.
// Direct-сообщения используют ChatAddress{ channel_type = DIRECT, scope_id = dialog_id }.

message OpenDirectDialogRequest {
  uint64 other_player_id = 1;
}

message OpenDirectDialogResponse {
  DirectDialogSummary dialog = 1;
}

message SendChatMessageRequest {
  ChatAddress address = 1;
  string text = 2;
  // Локальный id клиента для сопоставления "отправил" -> "сервер принял".
  uint64 client_message_id = 3;
}

message ChatAcceptedResponse {
  ChatAddress address = 1;
  uint64 client_message_id = 2;
  uint64 message_id = 3;
  uint64 message_seq = 4;
}

message FetchChatHistoryRequest {
  ChatAddress address = 1;
  uint64 after_message_seq = 2;
  uint32 limit = 3;
}

message ChatHistoryResponse {
  ChatAddress address = 1;
  repeated ChatMessageEvent messages = 2;
  bool has_more = 3;
  uint64 next_after_message_seq = 4;
}

message ChatMessageEvent {
  ChatAddress address = 1;
  uint64 message_id = 2;
  uint64 message_seq = 3;
  IdentityRef sender = 4;
  string original_text = 5;
  string display_text = 6;
  bool filtered = 7;
  int64 created_at_unix_ms = 8;
}
