// Historical design example; not the current Dreamsleeve contract.
// See docs/CurrentStateRu.md and the README in this example directory.
syntax = "proto3";

package mmochat.v1;

option csharp_namespace = "MmoChat.Protocol.V1";

import "common.proto";

message ServerAnnouncement {
  uint64 announcement_id = 1;
  string text = 2;
  uint32 interval_seconds = 3;
  bool enabled = 4;
  int64 created_at_unix_ms = 5;
  int64 updated_at_unix_ms = 6;
}

message GetServerSettingsRequest {}

message UpdateServerSettingsRequest {
  ServerSettingsSnapshot settings = 1;
}

message ServerSettingsResponse {
  ServerSettingsSnapshot settings = 1;
}

message GetServerAnnouncementsRequest {}

message PutServerAnnouncementRequest {
  ServerAnnouncement announcement = 1;
}

message DeleteServerAnnouncementRequest {
  uint64 announcement_id = 1;
}

message ServerAnnouncementListResponse {
  repeated ServerAnnouncement announcements = 1;
}

message ServerAnnouncementChangedEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_UPSERTED = 1;
    KIND_DELETED = 2;
  }

  Kind kind = 1;
  ServerAnnouncement announcement = 2;
  uint64 deleted_announcement_id = 3;
}

message RebindPlayerKeyRequest {
  uint64 player_id = 1;
  bytes new_public_key = 2;
  string reason = 3;
}

message RenamePlayerRequest {
  uint64 player_id = 1;
  string new_nickname = 2;
  string reason = 3;
}

message DisconnectPlayerRequest {
  uint64 player_id = 1;
  string reason = 2;
}

message AdminActionResponse {
  string action = 1;
  uint64 target_player_id = 2;
  string message = 3;
}
