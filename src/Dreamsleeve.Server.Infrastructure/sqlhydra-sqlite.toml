[general]
connection = "Data Source=../../build/sqlhydra/schema.db"
output = "Generated/AccountSchema.fs"
namespace = "Dreamsleeve.Server.Infrastructure.AccountSchema"
cli_mutable = false
mutable_properties = false
nullable_property_type = "option"

[sqlhydra_query_integration]
provider_db_type_attributes = true
table_declarations = true
left_joined_views = false

[filters]
include = ["main/accounts", "main/profiles", "main/account_passwords", "main/account_identities", "main/auth_tokens", "main/ground_marks", "main/admin_accounts", "main/admin_sessions", "main/admin_api_tokens", "main/player_roles", "main/admin_audit", "main/display_name_changes"]
exclude = []
