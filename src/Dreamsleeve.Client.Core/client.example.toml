# Omitted settings retain defaults. Keys are case-sensitive.
version = 1
serverIp = "127.0.0.1"
serverPort = 8778
authUrl = "http://127.0.0.1:8779"
allowInsecureRemoteAuth = false
commandCapacity = 8
stateCapacity = 8

[client]
connectTimeoutMs = 5000
disconnectTimeoutMs = 2000
sessionTimeoutMs = 5000
maxInitialPlayers = 4096
maxRecentMessages = 512
chatCapacity = 512
maxPendingChatRequests = 32
maxPendingPlayerUpdates = 32
maxActorValues = 64
playerSampleIntervalMs = 50
visibilityDistance = 8192
showFireflies = true
# STAT base form: plugin-local ID, without the load-order prefix.
fireflyPlugin = "Skyrim.esm"
fireflyFormId = 0x02EB0F
fireflyScale = 0.25 # 0.01..10.0; engine precision is 0.01
showFireflyNames = true
fireflyNameOcclusion = true # Hide names behind collision geometry
fireflyNameFontSize = 18 # HUD units, 8..48
fireflyNameOffset = 35 # Height above the firefly, 0..512 game units
maxPendingMovementSamples = 4096

[client.network]
maxPeers = 1
channelLimit = 3
inBwLimit = 0
outBwLimit = 0
maxPacketBytes = 1048576
maxWaitingData = 33554432

[interpolation]
delayMs = 150
maxGapMs = 1000
historyCapacity = 32
teleportDistance = 2048
