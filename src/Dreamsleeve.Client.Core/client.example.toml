# client.toml of the plugin (Data/SKSE/Plugins/Dreamsleeve) and of Client.Dev --config:
# every key with its default. Omitted keys keep the default; keys are case-sensitive.
# The plugin writes this file on first run; ranges are checked at start
# (Configuration::InvalidSetting). Chat, name and mark looks live in ui.toml.
version = 1
serverIp = "127.0.0.1"
serverPort = 8778
authUrl = "http://127.0.0.1:8779"
allowInsecureRemoteAuth = false
commandCapacity = 8
stateCapacity = 8

[client]
connectTimeoutMs = 5000
disconnectTimeoutMs = 2000
sessionTimeoutMs = 5000
maxInitialPlayers = 4096
maxRecentMessages = 512
chatCapacity = 512
maxPendingChatRequests = 32
maxPendingPlayerUpdates = 32
maxActorValues = 64
playerSampleIntervalMs = 50
visibilityDistance = 8192
showFireflies = true
# STAT base form: plugin-local ID, without the load-order prefix.
fireflyPlugin = "Skyrim.esm"
fireflyFormId = 0x02EB0F
fireflyScale = 0.25 # 0.01..10.0; engine precision is 0.01
captureKeyboard = true # Keep keyboard events from the game and other SKSE mods while the chat is open
# Ground marks: STAT base forms without collision, plugin-local IDs. Defaults are
# flat vanilla glow discs (FXGlowFlatRndBrt / FXGlowFlatRndDim); a missing form
# disables that kind of mark with an error in the log.
groundNotePlugin = "Skyrim.esm"
groundNoteFormId = 0x075DDB
groundNoteScale = 0.5 # 0.01..10.0
deathMarkPlugin = "Skyrim.esm"
deathMarkFormId = 0x075DD9
deathMarkScale = 0.5 # 0.01..10.0
maxPendingMovementSamples = 4096

[client.network]
maxPeers = 1
channelLimit = 3
inBwLimit = 0
outBwLimit = 0
maxPacketBytes = 1048576
maxWaitingData = 33554432

[interpolation]
delayMs = 150
maxGapMs = 1000
historyCapacity = 32
teleportDistance = 2048
