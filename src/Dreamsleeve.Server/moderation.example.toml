# Dreamsleeve server word list, tuned for stream safety rather than profanity.
# Copy to moderation.toml next to the server (Moderation.RulesPath in
# server.toml; [Moderation] Enabled = false turns the list off). Read once at
# startup: restart the server after editing. A missing file starts the server
# with an empty list and a warning; a syntax error, an unknown key or a
# non-string entry stops the start. The admin panel shows the list as read on
# its configuration page. Swearing is deliberately NOT listed: it is allowed on
# the major streaming platforms; add it yourself if needed.
#
# Two tiers:
#   [block] — refused. Checked for usernames and display names at registration,
#             display name changes (from the game and the panel), every chat
#             message, announcement text and its mod label, and ground note
#             before it is stored or relayed, and the character name before it
#             is published. Stored names it now refuses are shown to others as
#             "hidden.<id>" / "Player <id>"; stored notes it refuses are withheld.
#   [flag]  — delivered, but the matched ranges are marked. Each player chooses
#             in the chat settings whether to show them, mask them with stars
#             or hide the whole message ("Помеченные сообщения"). Flags apply to
#             chat messages, announcements and notes; names use the [block] tier.
# Move any entry between the tiers to match your community. Older files with
# words/substrings/exceptions at the top level are read as [block].
#
# Rule kinds in each tier:
#   words      — whole words or phrases: a word boundary is required on both
#                sides, so "хач" never matches "хачапури". Spaces in a phrase
#                match any spacing and punctuation between the words.
#   substrings — anywhere, also inside longer words. Only for roots that do not
#                occur in ordinary words.
#   exceptions — allowed words/phrases; a match lying entirely inside one of
#                them is ignored.
#
# Matching uses a separate normalized copy; the original text is kept. Handled:
# case, full-width and other compatibility forms (NFKC), accents, invisible and
# format characters, Cyrillic/Greek look-alike letters, digits and symbols typed
# as letters (4/@ → a, 3 → e, 1/!/| → i, 0 → o, 5/$ → s, 7 → t, 8 → b),
# stretched letters ("nooo") and punctuation inside a word ("n.a.z.i").
# Punctuation inside a rule is optional: "t.me" also matches "tme".
# Letters separated only by spaces are not joined, to avoid false positives.
#
# Not covered on purpose: political opinions, religion, sexual orientation and
# gender identity as topics, names of public figures. Laws differ by country;
# add region-specific entries yourself. This is a baseline filter, not complete
# moderation: context, images, links in other forms and new slang pass through.

[block]
