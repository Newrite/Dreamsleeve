# Omitted settings retain defaults. Keys are case-sensitive.
[Server]
ServerName = "Dreamsleeve"
BindAddress = "127.0.0.1"
Port = 8778
PeerLimit = 32
ChannelLimit = 3
ServiceTimeoutMs = 0
EventBudget = 64
MaxPacketBytes = 1048576
MovementPacketTargetBytes = 0
ReceiveBufferBytes = 262144
SendBufferBytes = 262144
MaxWaitingData = 33554432
MaxOutgoingPacketsPerPeer = 256
MaxOutgoingBytesPerPeer = 4194304
MaxOutgoingPackets = 4096
MaxOutgoingBytes = 33554432
MaxInitialPlayers = 4096
MaxRecentMessages = 512

[Server.Worker]
QueueCapacity = 65536
QueueBytes = 16777216
SendCommandsPerPass = 2048
SendBytesPerPass = 4194304
WorkBudgetMs = 2
IdleWaitMs = 1

[Server.ChatInput]
Username = 32
DisplayName = 64
MessageText = 2000
# Client announcements (Unicode scalar values). Server announcements use MessageText.
AnnouncementText = 500
# Self-declared label of the mod posting an announcement, 1..128.
AnnouncementSignature = 64
# A note written on the ground (Unicode scalar values); the chat text rules apply.
GroundNoteText = 200
# Death mark label (killer or cause), one line, 1..128; the client may leave it empty.
DeathMarkText = 64

[Server.PlayerInput]
CharacterName = 128
PluginName = 260
LocationName = 256
ActorValueKey = 128
ActorValueName = 128
MaxActorValues = 64
DetailsText = 256
ActivityKey = 64

[Runtime]
MaxSessions = 32
MailboxCapacity = 256
# At least 4 * MaxSessions + 4: one cleanup acknowledgement per source (chat, system, presence, ground marks) per session.
ControlReserve = 160
OpenTimeoutMs = 10000
ShutdownTimeoutMs = 1500
PollIntervalMs = 1

[Runtime.Player]
MailboxCapacity = 128
ControlReserve = 32
MaxPendingChat = 16
MaxPendingUpdates = 16
MaxBootstrapEvents = 128
MaxPendingOutput = 128

[Runtime.Chat]
MailboxCapacity = 256
ControlReserve = 64
HistoryCapacity = 512
MaxControlDeliveries = 128
# Anti-spam per stable account ID; reconnecting does not reset it.
# Up to RateBurst messages at once, then one more per RateRefillMs.
RateBurst = 5
RateRefillMs = 2000
# The same normalized text is refused again within this window; 0 disables the check.
DuplicateWindowMs = 30000

[Runtime.Presence]
MailboxCapacity = 128
ControlReserve = 64
MaxControlDeliveries = 128
ReplicationIntervalMs = 50
VisibilityDistance = 8192

[Database]
DatabasePath = "data/dreamsleeve.db"
BusyTimeoutSeconds = 5

[Authentication]
ListenUrl = "http://127.0.0.1:8779"
AllowInsecureLoopback = true
# Explicit opt-in for remote HTTP; passwords and tokens are sent without TLS.
AllowInsecureRemote = false
AllowRegistration = true
CertificatePath = ""
RequestsPerMinute = 120
RequestTimeoutSeconds = 15

[Authentication.Service]
MailboxCapacity = 64
MaxConcurrentOperations = 4
MaxTickets = 4096
TicketLifetimeSeconds = 60
PasswordIterations = 210000
SavedLoginDays = 30
MaxSavedLogins = 8
ResetLifetimeMinutes = 15

[Logging]
MinimumLevel = "Information"
Console = true
FilePath = "logs/server-.json"
FileSizeLimitBytes = 10485760
RetainedFileCount = 14

[Moderation]
# Word-list checks of new usernames/display names, chat text and published
# character names. false disables only the word list; anti-spam stays active.
Enabled = true
# Separate TOML (see moderation.example.toml), relative to the working directory.
# A missing file starts the server with an empty list and a warning.
RulesPath = "moderation.toml"

# "Hide my name from other players": while a player keeps it on, everyone else
# sees a server pseudonym instead of their username, display name and character
# name; the player still sees their own profile. PlayerId stays public. Read at
# startup; a missing section keeps these defaults.
[Identity]
# false refuses the mode: opening a hidden session or switching gets
# HIDDEN_IDENTITY_NOT_ALLOWED and the real profile is never sent in its place.
AllowHiddenIdentity = true
# A session may switch no sooner than this after its previous switch; sooner
# gets RATE_LIMITED and nothing changes. 0 disables the limit.
ToggleIntervalMs = 30000
# Separate TOML (see pseudonyms.example.toml), relative to the working directory.
# A missing or broken file uses the 24 built-in names with a warning.
PseudonymsPath = "pseudonyms.toml"

# System channel: server announcements and announcements requested by clients.
# A channel of its own, read-only for chat. Read at startup, like the rest of
# this file; there is no hot reload. A missing section keeps these defaults:
# every client source is accepted.
[Announcements]
# Retained announcements, also sent at session opening; at most Server.MaxRecentMessages.
HistoryCapacity = 128
# Client announcements per stable account; chat has its own limit in Runtime.Chat.
RateBurst = 3
RateRefillMs = 20000
# The same normalized text is refused again within this window; 0 disables the check.
DuplicateWindowMs = 300000

# Requested by the Dreamsleeve client itself. A disabled source is refused with
# ANNOUNCEMENT_NOT_ALLOWED; further per-source rules will live in these tables.
[Announcements.TrustedClient]
Enabled = true

# Requested by other mods through the Dreamsleeve C++/Papyrus API.
[Announcements.ThirdParty]
Enabled = true

# Server announcements: Kind is Announcement, Event, Admin or Periodic.
# IntervalSeconds = 0 publishes once after DelaySeconds; otherwise at least 10.
# Scheduled announcements take system channel history, so keep intervals long.
# [[Announcements.Scheduled]]
# Text = "Welcome to Dreamsleeve. Be kind to other travellers."
# Kind = "Periodic"
# DelaySeconds = 60
# IntervalSeconds = 1800

# Marks on the ground: notes players leave and places where characters died.
# Persistent in SQLite (schema 3); shown to players nearby like poses. Read at
# startup; a missing section keeps these defaults.
[GroundMarks]
MailboxCapacity = 256
ControlReserve = 64
MaxControlDeliveries = 128
# Queued storage writes before the owner treats the database as broken and stops.
MaxPendingWrites = 256
# Delivery radius in world units, same space (WRLD/CELL) only. A client cannot
# draw marks farther than this; by default equal to Runtime.Presence.VisibilityDistance.
VisibilityDistance = 8192
# Per account and kind; a new mark beyond the quota evicts the author's oldest of that kind.
MaxNotesPerPlayer = 5
MaxDeathMarksPerPlayer = 10
# Lifetimes in days; 0 keeps the kind forever. Expired marks are removed lazily.
NoteTtlDays = 30
DeathMarkTtlDays = 7
# Marks one spatial index cell (VisibilityDistance on a side) may hold; more is
# refused with GROUND_MARK_AREA_FULL, nothing of other players is evicted.
MaxPerIndexCell = 64
# Notes per stable account: up to RateBurst at once, then one per RateRefillMs;
# the same normalized text is refused again within DuplicateWindowMs (0 disables).
RateBurst = 3
RateRefillMs = 20000
DuplicateWindowMs = 300000
# Deaths reported closer together than this are refused with RATE_LIMITED.
DeathMinIntervalMs = 5000
# A placement farther than this from the player's last known position is refused; 0 disables.
MaxPlacementDistance = 2048
# How often expired marks are collected (milliseconds, at least 1000).
ExpiryCheckIntervalMs = 60000
