# Proposed native host UI settings; not yet a ClientSettings section.
[ui.chat]
showFireflyNames = true
fireflyNameOcclusion = true
fireflyNameFontSize = 18
fireflyNameOffset = 35
showBubbles = true
bubbleDuration = 8.0
bubbleFade = true
bubbleFadeDuration = 1.0
bubbleFontSize = 16
bubbleMaxWidth = 320
bubbleBackground = 0.65
onlineView = "cards"
fade = true
delay = 12.0
duration = 1.0
idleOpacity = 0.0
scale = 1.0
fontSize = 16
font = "sans"
lineHeight = 1.45
background = 0.82
timestamps = true
fullColor = false
# username | display | character; without a character name the display name is shown.
nameMode = "display"
# Local pseudonyms (aliases.toml) instead of every real name on every surface.
streamerMode = false
# Server-flagged ranges: off | mask (stars) | hide (whole message; own shown as a placeholder).
textFilter = "off"
locked = true
x = 0.025
y = 0.42
width = 680
height = 390
activationKey = "Enter"
theme = "skyrim"

# Written by the plugin, never sent to the server. IDs are scoped by the
# server address "ip:port": an account ID is unique only within its server.
# [[names.aliases]]
# server = "127.0.0.1:8778"
# id = "42"
# name = "Страж 2"
#
# [[names.ignored]]
# server = "127.0.0.1:8778"
# id = "7"
# displayName = "Name when ignored"   # shown outside streamer mode only
# username = "name"
