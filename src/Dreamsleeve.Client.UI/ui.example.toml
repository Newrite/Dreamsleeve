# Proposed native host UI settings; not yet a ClientSettings section.
[ui.chat]
showFireflyNames = true
fireflyNameOcclusion = true
fireflyNameFontSize = 18
fireflyNameOffset = 35
showBubbles = true
bubbleDuration = 8.0
bubbleFade = true
bubbleFadeDuration = 1.0
bubbleFontSize = 16
bubbleMaxWidth = 320
bubbleBackground = 0.65
onlineView = "cards"
fade = true
delay = 12.0
duration = 1.0
idleOpacity = 0.0
scale = 1.0
fontSize = 16
font = "sans"
lineHeight = 1.45
background = 0.82
timestamps = true
fullColor = false
# username | display | character; without a character name the display name is shown.
nameMode = "display"
# Local pseudonyms (aliases.toml) instead of every real name on every surface.
streamerMode = false
# Server-flagged ranges: off | mask (stars) | hide (whole message; own shown as a placeholder).
textFilter = "off"
locked = true
x = 0.025
y = 0.42
width = 680
height = 390
activationKey = "Enter"
theme = "skyrim"
# tab (only the announcements tab) | all (also "Все") | current (every tab).
announcementChannels = "all"
announcementsServer = true
announcementsTrustedClient = true
announcementsThirdParty = true
announcementsEvents = true
announcementsPeriodic = true
# Bubble look: the fill opacity is bubbleBackground; border and text colour ("#RRGGBB")
# are separate, so "no box at all" is bubbleBackground = 0 and bubbleBorder = false.
bubbleBorder = true
bubbleTextColor = "#EEECE5"
fireflyNameColor = "#EEECE5"
fireflyHeightOffset = 110 # Glow height above the pose origin, game units 0..512
# Ground marks (docs/GroundMarksRu.md): kinds, counts, distances and the label look.
showGroundNotes = true
showDeathMarks = true
maxVisibleNotes = 16 # 1..64 nearest
maxVisibleDeaths = 16
groundDrawDistance = 4096 # game units, 0..16384
groundNoteOffset = 5 # above the floor hit, -64..256
deathMarkOffset = 5
groundNameDistance = 600 # author name visible within, 50..4096 (10% hysteresis)
groundTextDistance = 150 # text visible within, 50..4096
groundFontSize = 16
groundMaxWidth = 320
groundBackground = 0.65
groundBorder = true
groundTextColor = "#EEECE5"
deathTextColor = "#D9534F" # death label and author name
deathBackground = 0.65
deathBorder = true
combatHideGroundMarks = false # statics and labels
combatHideGroundText = false # labels only

# Written by the plugin, never sent to the server. IDs are scoped by the
# server address "ip:port": an account ID is unique only within its server.
# [[names.aliases]]
# server = "127.0.0.1:8778"
# id = "42"
# name = "Страж 2"
#
# [[names.ignored]]
# server = "127.0.0.1:8778"
# id = "7"
# displayName = "Name when ignored"   # shown outside streamer mode only
# username = "name"
